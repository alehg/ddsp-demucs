# Same as exp001_dualfir_tuned.yaml plus learned multiplicative output gate on DDSPDecoder.
# Use with the same CLI overrides as expB2_dualfir_z64_stage2_sisdr (stage-2 recipe).

dataset:
  kind: hq
  root: /Users/alexhg/Documents/Tesis Mate/Datasets/musdb18hq
  sample_rate: 44100

paths:
  project: .
  stems_dir: data/stems/demucs_htdemucs44k
  features_dir: data/features
  tfrecords_dir: data/tfrecords
  exp_dir: exp

mono_downmix: avg_lr

gate_thresholds:
  f0_conf_min: 0.65
  harmonicity_ratio_min: 0.65
  residual_energy_ratio_max: 0.38
  mono_frame_fraction_min: 0.8
  mono_track_fraction_min: 0.88

training:
  sample_rate: 16000
  frame_rate: 250
  win_s: 4.0
  batch_size: 8
  learning_rate: 1e-3
  epochs: 50
  validation_split: 0.1

model:
  n_harmonics: 64
  n_noise_bands: 65
  rnn_units: 256
  mlp_units: [256, 128]
  f0_midi_range: [24.0, 84.0]
  z_dims: 128
  z_time_steps: 250
  z_rnn_channels: 512
  use_learned_output_gate: true
  # Sharper filtered-noise dynamics + split harmonic/noise output gates (see DDSPDecoder).
  consonant_noise_enhancements: true
  voiced_transient_noise_leak: 0.36
  # Attenuate noise (not harmonics) after consonants on sustained voiced frames.
  use_noise_ducking: true

loss:
  fft_sizes: [2048, 1024, 512, 256, 128, 64]
  loss_type: L1
  mag_weight: 1.0
  logmag_weight: 0.2
  delta_freq_weight: 0.2
  delta_time_weight: 0.05
  mel_weight: 0.8
  hf_mel_weight: 2.0
  centroid_weight: 0.1
  transient_weight: 0.38
  hf_onset_weight: 0.15
